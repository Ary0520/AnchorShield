[package]
name = "market-factory"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
# interfaces is rlib — provides InsuranceMarketClient + AnchorStakeClient traits
interfaces = { path = "../interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# needed in tests to upload WASM and register contracts in the test env
anchor-stake = { path = "../anchor-stake", features = ["testutils"] }
insurance-market = { path = "../insurance-market", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
